[package]
name = "ggg-ipc"
version = "0.1.0"
edition = "2024"
authors = ["yuinshielAs"]
description = "Shared IPC types and Named Pipe client used by ggg, ggg-dnd, and ggg-bridge"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
